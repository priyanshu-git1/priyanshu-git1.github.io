<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        /* Navbar */
        nav {
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        /* Hero */
        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #60a5fa;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.7;
            color: #dbeafe;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
        }

        .secondary {
            border: 1px solid #60a5fa;
            color: white;
        }

        .secondary:hover {
            background: #60a5fa;
            color: #0f172a;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .hero h1 {
                font-size: 40px;
            }

            .hero p {
                font-size: 17px;
            }

            .nav-links {
                display: none;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MyWebsite</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-content">

            <h1>
                Welcome to <span>MyWebsite</span>
            </h1>

            <p>
                Build something amazing with a modern,
                fast and user-friendly web experience.
            </p>

            <div class="buttons">
                <a href="#" class="btn primary">Get Started</a>
                <a href="#" class="btn secondary">Learn More</a>
            </div>

        </div>
    </section>

</body>
</html>
